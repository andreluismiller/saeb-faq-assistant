[project]
name = "saeb-faq-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "André Miller", email = "andreluismiller@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastembed>=0.8.0",
    "jupyter>=1.1.1",
    "minsearch>=0.2.0",
    "openai>=2.51.0",
    "python-dotenv>=1.2.2",
    "qdrant-client>=1.18.0",
    "requests>=2.34.2",
]

[project.scripts]
saeb-faq-assistant = "saeb_faq_assistant:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
